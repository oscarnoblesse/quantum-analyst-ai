[project]
name = "quantum-ready"
version = "1.0.0"
description = "Copilote multi-agents de migration post-quantique (CBOM CycloneDX 1.6, Mosca, TLS 1.3 hybride) avec un modèle de langage local"
readme = "README.md"
authors = [
    { name = "Oscar Noblesse", email = "ton.email@exemple.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asn1crypto>=1.5.1",
    "cryptography>=46",
    "cyclonedx-python-lib[json-validation]>=11.12.0",
    "httpx>=0.28.1",
    "langgraph>=1.0",
    "mcp>=1.20,<2",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
quantum-ready = "quantum_ready:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
# Vérification optionnelle du magasin JKS du SI v2 par une bibliothèque tierce (tests/test_si_fictif_v2.py).
# Hors du groupe dev : pyjks dépend de twofish, distribué sans roue précompilée ; il faut un compilateur C,
# absent de l'image Docker et non garanti sous Windows. Installation : uv sync --group verification-jks
verification-jks = [
    "pyjks>=20.0.0",
]

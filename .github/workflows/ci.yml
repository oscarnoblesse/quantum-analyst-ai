name: CI

on:
  push:
  pull_request:

jobs:
  reproduction:
    name: Reproduction (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Reproduire le projet (environnement, SI fictif, vérification, tests)
        run: uv run python scripts/reproduire.py

  demonstrateur:
    name: Démonstrateur TLS hybride (ubuntu, Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Construire, lancer et vérifier le laboratoire TLS
        run: uv run python scripts/demonstrateur.py
      - name: Générer results/metrics.json
        run: uv run python -m quantum_ready.evaluation.metriques

  bench-pqc:
    name: Mesure hybride vs classique (ubuntu, Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Mesurer le handshake (1000 après 100 d'échauffement) et vérifier les propriétés
        run: uv run python scripts/bench_pqc.py
      - name: Publier les résultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench_pqc
          path: results/raw/bench_pqc.json

  reproduce-small-modele:
    name: Chaîne complète avec un très petit modèle (qwen3:0.6b, ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Reproduire la chaîne avec qwen3:0.6b (journal et rejeu vérifiés)
        run: uv run python scripts/reproduce_petit_modele.py

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Pages

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Générer la page depuis results/metrics.json
        run: uv run python -m quantum_ready.evaluation.page
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site
      - id: deploiement
        uses: actions/deploy-pages@v4
